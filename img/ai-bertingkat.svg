<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" width="1200" height="625" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="625" rx="18" fill="#ffffff"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">AI Bertingkat di LENTERA</text>
  <text x="40" y="80" font-size="15" fill="#64748b">Bangun dari bawah: yang pasti jalan dulu, baru yang lebih pintar</text>

  <!-- Sumbu kiri -->
  <path d="M62 525 V112" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#ah)"/>
  <text transform="translate(44 318) rotate(-90)" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">makin pintar · makin butuh data</text>

  <!-- ===== TINGKAT 3 ===== -->
  <rect x="100" y="110" width="1060" height="125" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="100" y="110" width="240" height="125" rx="14" fill="#7c3aed"/>
  <rect x="320" y="110" width="20" height="125" fill="#7c3aed"/>
  <text x="122" y="148" font-size="13" font-weight="700" fill="#ede9fe" letter-spacing="1.5">TINGKAT 3</text>
  <text x="122" y="178" font-size="20" font-weight="700" fill="#ffffff">Anomali vs pola</text>
  <text x="122" y="204" font-size="20" font-weight="700" fill="#ffffff">rumah sendiri</text>
  <rect x="975" y="124" width="170" height="30" rx="15" fill="#7c3aed"/>
  <text x="1060" y="144" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Cloud · butuh riwayat</text>
  <text x="365" y="152" font-size="15" fill="#334155">• Baseline konsumsi per jam &amp; per hari untuk setiap rumah</text>
  <text x="365" y="180" font-size="15" fill="#334155">• Deteksi penyimpangan: z-score / Isolation Forest</text>
  <text x="365" y="210" font-size="14.5" font-style="italic" fill="#6d28d9">“Konsumsi malam ini 2× rata-rata 2 minggu terakhir.”</text>

  <!-- ===== TINGKAT 2 ===== -->
  <rect x="100" y="255" width="1060" height="125" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="100" y="255" width="240" height="125" rx="14" fill="#2563eb"/>
  <rect x="320" y="255" width="20" height="125" fill="#2563eb"/>
  <text x="122" y="293" font-size="13" font-weight="700" fill="#dbeafe" letter-spacing="1.5">TINGKAT 2</text>
  <text x="122" y="323" font-size="20" font-weight="700" fill="#ffffff">Kenali perangkat</text>
  <text x="122" y="349" font-size="20" font-weight="700" fill="#ffffff">(NILM sederhana)</text>
  <rect x="975" y="269" width="170" height="30" rx="15" fill="#2563eb"/>
  <text x="1060" y="289" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32 / Cloud</text>
  <text x="365" y="297" font-size="15" fill="#334155">• Deteksi event: lonjakan ΔP, ΔPF, lama menyala, pola siklus</text>
  <text x="365" y="325" font-size="15" fill="#334155">• Klasifier ringan (kNN / Random Forest) — cukup kecil untuk ESP32</text>
  <text x="365" y="355" font-size="14.5" font-style="italic" fill="#1d4ed8">Belajar dari data lab + label penghuni: “Barusan ada beban 350 W, ini apa?”</text>

  <!-- ===== TINGKAT 1 ===== -->
  <rect x="100" y="400" width="1060" height="125" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="100" y="400" width="240" height="125" rx="14" fill="#16a34a"/>
  <rect x="320" y="400" width="20" height="125" fill="#16a34a"/>
  <text x="122" y="438" font-size="13" font-weight="700" fill="#dcfce7" letter-spacing="1.5">TINGKAT 1 · FONDASI</text>
  <text x="122" y="468" font-size="20" font-weight="700" fill="#ffffff">Aturan</text>
  <text x="122" y="494" font-size="20" font-weight="700" fill="#ffffff">keselamatan</text>
  <rect x="975" y="414" width="170" height="30" rx="15" fill="#16a34a"/>
  <text x="1060" y="434" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32 · offline</text>
  <text x="1060" y="462" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">PASTI jalan</text>
  <text x="365" y="442" font-size="15" fill="#334155">• Beban mendekati batas VA → peringatan “sisa daya / mau jeglek”</text>
  <text x="365" y="470" font-size="15" fill="#334155">• Suhu panel tinggi atau ada asap → buzzer + notifikasi</text>
  <text x="365" y="498" font-size="15" fill="#334155">• Beban ±X W menyala lebih dari N jam → “pompa air kemungkinan bocor”</text>

  <!-- Prinsip -->
  <rect x="100" y="550" width="1060" height="48" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="122" y="580" font-size="14.5" fill="#78350f"><tspan font-weight="700">Prinsip: </tspan>nilai utama produk harus sudah terasa di Tingkat 1. Tingkat 2–3 adalah nilai tambah, bukan fondasi.</text>
</svg>
